<!DOCTYPE html>
<html>
<head>
  <title>Maths Solution Window</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/latest.js?config=TeX-MML-AM_CHTML">
  </script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <style>
    body { margin: 16px; }
    #a2 { color: red; margin: 20px 0; }
    canvas { display: block; margin-bottom: 12px; }
    /* Coordinate tables (simultaneous equations, etc.) */
    table {
      margin-left: 75px;
      margin-right: 75px;
      margin-bottom: 30px;
    }
    td, th {
      border: 1px solid #dddddd;
      text-align: center;
      width: 60px;
      padding: 8px;
    }
  </style>
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      "fast-preview": { disabled: true },
      tex2jax: { preview: "none" }
    });
  </script>
</head>
<body>
  <canvas id="myCanvas3" width="0.5" height="0.5" style="border:none"></canvas>
  <div id="a2"></div>
</body>
</html>
